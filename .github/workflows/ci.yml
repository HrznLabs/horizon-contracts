name: CI

# Unit tests only. Static checks (build, sizes, fmt) run locally in the
# monorepo (packages/contracts), which this repo mirrors read-only.
on:
  # Not on PRs into main: the automated staging-to-main promotion PR is opened by the bot and merged at once,
  # so its run would only wait for approval and expire. The promotion workflow has its own build gate.
  pull_request:
    branches: [staging]
  push:
    branches: [staging]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Forge test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable

      - name: Restore solc and forge artifacts
        id: forge-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            cache
            out
            ~/.svm
          key: forge-${{ runner.os }}-${{ hashFiles('foundry.toml', 'foundry.lock', 'src/**/*.sol', 'lib/**/*.sol') }}
          restore-keys: |
            forge-${{ runner.os }}-

      - name: Run tests
        run: forge test -vv

      # Save even when tests fail, so a red run does not leave the next one cold.
      - name: Save solc and forge artifacts
        if: always() && steps.forge-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            cache
            out
            ~/.svm
          key: ${{ steps.forge-cache.outputs.cache-primary-key }}
